      description: Retrieves unalterable digital evidence records from Chamber 17
        and Module 17 V24 WORM Storage (Zero-Deletion Guarantee).
      operationId: getAuditRecords
      tags:
      - Audit & Evidence
      parameters:
      - name: sealId
        in: query
        required: true
        description: Canonical Seal ID (1 to 14,902)
        schema:
          type: integer
          example: 14902
      responses:
        '200':
          description: Canonical audit record found and verified intact.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditRecordResponse'
              example:
