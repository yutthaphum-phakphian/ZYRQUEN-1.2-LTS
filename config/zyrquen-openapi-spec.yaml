components:
  securitySchemes:
    PqcSignatureAuth:
      type: apiKey
      in: header
      name: X-Zyrquen-Sovereign-Sig
      description: Post-Quantum Dilithium-5 (ML-DSA-87) signature header bound to
        user identity and payload hash.
    HsmQuorumAuth:
      type: apiKey
      in: header
      name: X-Zyrquen-HSM-Quorum
      description: Unanimous 10/10 REAL_HSM Quorum attestation token (FIPS 140-3 Level
        4).
  schemas:
    TelemetryResponse:
      type: object
      properties:
        status:
          type: string
          example: SUCCESS
        systemStatus:
          type: string
          example: LOCKED_FROZEN_v1.2_LTS
        blockHeight:
          type: integer
          example: 849202
        merkleGenesis:
          type: string
          example: '0x909ab814479844d8a14816bed34cdbb07528e18501da86fc4691763a43fa4c68'
        cryoTempMK:
          type: number
          format: float
          example: 14.98
        qopsThroughput:
          type: number
          format: float
          example: 851.9
        coherencePct:
          type: number
          format: float
          example: 99.992
        zeroDrift:
          type: string
          example: 0.00%
    AuditRecordResponse:
      type: object
      properties:
        sealId:
          type: integer
          example: 14902
        blockHeight:
          type: integer
          example: 849202
        merkleLeafHash:
          type: string
          example: '0x5a13396c129c611f15232fdaf54bfad00c4147abdbc3424c71e4ec103dcc8cc3'
        status:
          type: string
          example: VERIFIED_INTACT
        wormStorage:
          type: string
          example: Module 17 V24 WORM
        legalTag:
          type: string
          example: ETA B.E. 2544 Sec 28 / Delete-Nothing Enforced
    TraceReplayRequest:
      type: object
      required:
      - sealId
      properties:
        sealId:
          type: integer
          example: 14903
        auditMode:
          type: string
          example: FULL_TRACE_REPLAY
    TraceReplayResponse:
      type: object
      properties:
        sealId:
          type: integer
          example: 14903
        status:
          type: string
          example: COMPLETED
        executionTimeMs:
          type: number
          format: float
          example: 35.8
        slaLimitMs:
          type: number
          format: float
          example: 142.0
        verdict:
          type: string
          example: 100% COURT-ADMISSIBLE READY
        stagesPassed:
          type: integer
          example: 12
        finalStage:
          type: string
          example: 'STAGE-12: CLOSURE (Immutable WORM Finalized)'
    RegisterAuthRequest:
      type: object
      required:
      - user
      - auth
      properties:
        user:
          type: object
          properties:
            id:
              type: string
              example: USR-001
            name:
              type: string
              example: Yuttaphum Phakphian
            role:
              type: string
              example: Sovereign Principal Architect
        auth:
          type: object
          properties:
            ial:
              type: integer
              example: 3
            aal:
              type: integer
              example: 3
            cryptoScheme:
              type: string
              example: Dilithium-5
            hsmSigned:
              type: boolean
              example: true
    RegisterAuthResponse:
      type: object
      properties:
        status:
          type: string
          example: SUCCESS
        system_status:
          type: string
          example: LOCKED_FROZEN_v1.2_LTS
        verdict:
          type: string
          example: APPROVED_SECTION_26
        reason:
          type: string
        sentinel_risk_score:
          type: number
          format: float
          example: 0.02
        user_profile:
          type: object
    TreasuryRefundRequest:
      type: object
      required:
      - allocationSegment
      properties:
        allocationSegment:
          type: string
          enum:
          - Gen_Z_Core
          - Gen_Y_Pro
          - Gen_X_Enterprise
          - SMB_Retail
          example: Gen_Z_Core
        totalGasRefundPoolThb:
          type: number
          format: float
          example: 12500000.0
    TreasuryRefundResponse:
      type: object
      properties:
        status:
          type: string
          example: COMPLETED
        verdict:
          type: string
          example: APPROVED_SECTION_28
        reason:
          type: string
        genesis_block:
          type: integer
          example: 849202
        merkle_root:
          type: string
        audit_trail:
          type: object
        distribution:
          type: object
    GoldSealVerifyRequest:
      type: object
      required:
      - sealId
      - leafHash
      properties:
        sealId:
          type: integer
          example: 14902
        leafHash:
          type: string
          example: '0x5a13396c129c611f15232fdaf54bfad00c4147abdbc3424c71e4ec103dcc8cc3'
    GoldSealVerifyResponse:
      type: object
      properties:
        verified:
          type: boolean
          example: true
        blockHeight:
          type: integer
          example: 849202
        merkleRoot:
          type: string
        zeroDrift:
          type: string
          example: 0.00%
        courtAdmissibility:
          type: string
          example: 100% COURT-ADMISSIBLE READY
    QuarantineErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: ZYRQUEN_QUARANTINE_TRIGGERED
        verdict:
          type: string
          example: QUARANTINED
        chamber:
          type: string
          example: Chamber 02 (FORENSICS & QUARANTINE)
        riskScore:
          type: number
          format: float
          example: 0.96
        reason:
          type: string
        timestamp:
          type: string
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        reason:
          type: string
