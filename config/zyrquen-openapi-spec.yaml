                blockHeight: 849202
                merkleLeafHash: '0x5a13396c129c611f15232fdaf54bfad00c4147abdbc3424c71e4ec103dcc8cc3'
                status: VERIFIED_INTACT
                wormStorage: Module 17 V24 WORM
                legalTag: ETA B.E. 2544 Sec 28 / Delete-Nothing Enforced
