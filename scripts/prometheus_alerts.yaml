groups:
  - name: zyrquen_sovereign_alerts
    rules:
      - alert: SSoTBaselineDriftDetected
        expr: zyrquen_ssot_baseline_drift_percent > 0.000
        for: 0s
        labels:
          severity: critical
          system: ZYRQUEN_SOVEREIGN_ENGINE
        annotations:
          summary: "CRITICAL: SSoT Baseline Drift Detected (Δ > 0.000%)"
          description: "Sovereign Engine SSoT Baseline has drifted from Genesis Anchor #849202. Immediate isolation required."

      - alert: Chamber02QuarantineSpike
        expr: rate(zyrquen_quarantine_http_423_total[1m]) > 10
        for: 10s
        labels:
          severity: warning
          system: ZYRQUEN_SENTINEL_PLANE
        annotations:
          summary: "WARNING: High Chamber 02 Quarantine Spike (HTTP 423)"
          description: "Active Interceptor (Risk ≥ 0.85) triggered high-volume quarantine events. Auto-remediation active."

      - alert: HSMDecaKeyQuorumDegraded
        expr: zyrquen_hsm_active_quorum_nodes < 10
        for: 0s
        labels:
          severity: critical
          system: ZYRQUEN_HSM_CLUSTER
        annotations:
          summary: "CRITICAL: 10/10 REAL_HSM Quorum Consensus Degraded"
          description: "FIPS 140-3 Level 4 HSM Cluster lost quorum (Nodes active < 10). PQC signing paused."

      - alert: QuantumCoherenceDegraded
        expr: zyrquen_quantum_satellite_coherence_percent < 99.990
        for: 5s
        labels:
          severity: warning
          system: ZYRQUEN_QUANTUM_GATEWAY
        annotations:
          summary: "WARNING: Quantum Satellite Coherence below 99.990%"
          description: "Telemetric signal coherence degraded. Fail-closed satellite link monitoring active."

      - alert: SubKelvinThermalBusAnomalous
        expr: zyrquen_cryo_thermal_mK > 20.00
        for: 2s
        labels:
          severity: critical
          system: ZYRQUEN_CRYO_THERMAL_BUS
        annotations:
          summary: "CRITICAL: Cryo-Thermal Bus Temperature > 20.00 mK"
          description: "Sub-Kelvin thermal stability limit exceeded. Fail-closed thermal trigger (85.0°C / Cryo) armed."

      - alert: ReplayVerificationSLAViolated
        expr: zyrquen_replay_verification_duration_ms > 142.00
        for: 0s
        labels:
          severity: critical
          system: ZYRQUEN_FORENSIC_REPLAY
        annotations:
          summary: "CRITICAL: 12-Stage Replay Execution Time > 142.00 ms SLA"
          description: "Replay execution exceeded statutory SLA limit (35.80ms baseline breached)."
