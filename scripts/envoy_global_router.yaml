# =============================================================================
# ZYRQUEN Ω∞ Senate Gate — Envoy Global Edge & Quorum Router v5.0 LTS
# Geo-Distributed Active-Active Routing with Automatic Outlier Ejection & mTLS
# =============================================================================

static_resources:
  listeners:
    - name: senate_gate_ingress
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8443
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                tls_certificates:
                  - certificate_chain:
                      filename: /etc/ssl/certs/senategate-cert.pem
                    private_key:
                      filename: /etc/ssl/private/senategate-key.pem
                validation_context:
                  trusted_ca:
                    filename: /etc/ssl/certs/zyrquen-root-ca.pem
                  match_typed_subject_alt_names:
                    - san_type: URI
                      matcher:
                        exact: spiffe://senate.zyrquen.network/ns/senate-governance/sa/senate-gate-sa
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: senate_gate_http
                codec_type: AUTO
                route_config:
                  name: senate_gate_global_route
                  virtual_hosts:
                    - name: senate_gate_vhosts
                      domains: ["senate.zyrquen.network", "*.senate.zyrquen.internal"]
                      routes:
                        # Fast-path health & readiness checks
                        - match:
                            prefix: "/health/"
                          route:
                            cluster: senategate_local_cluster
                            timeout: 0.5s

                        # OPA Decision & Quorum REST Ingress
                        - match:
                            prefix: "/v1/data/zyrquen/governance/senate"
                          route:
                            cluster: senategate_geo_mesh
                            timeout: 1.5s
                            retry_policy:
                              retry_on: "5xx,connect-failure,reset"
                              num_retries: 2
                              per_try_timeout: 0.8s
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # 1. Local Node Cluster (Sub-millisecond)
    - name: senategate_local_cluster
      connect_timeout: 0.25s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: senategate_local_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 8181

    # 2. Geo-Distributed Multi-Region Mesh with Outlier Detection
    - name: senategate_geo_mesh
      connect_timeout: 0.5s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            max_connections: 4096
            max_pending_requests: 1024
            max_requests: 16384
      outlier_detection:
        consecutive_5xx: 3
        interval: 5s
        base_ejection_time: 30s
        max_ejection_percent: 50
      load_assignment:
        cluster_name: senategate_geo_mesh
        endpoints:
          # Region 1: US-East (Primary Priority 0)
          - priority: 0
            lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: senate-gate-us-east.senate.internal
                      port_value: 8181

          # Region 2: EU-Central (Failover Priority 1)
          - priority: 1
            lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: senate-gate-eu-central.senate.internal
                      port_value: 8181

          # Region 3: AP-Southeast (Failover Priority 2)
          - priority: 2
            lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: senate-gate-ap-southeast.senate.internal
                      port_value: 8181
