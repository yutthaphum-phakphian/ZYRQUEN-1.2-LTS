<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Glowing Cyan Gradient -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Glowing Violet Gradient -->
    <linearGradient id="violet-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Neon Pulse Dual Gradient -->
    <linearGradient id="pulse-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <!-- High-Glow Filter Effect -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="15" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft Ambient Glow Filter -->
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
    </filter>
  </defs>

  <!-- Dark Console Container Background -->
  <rect width="800" height="240" rx="16" fill="url(#bg-grad)" stroke="#1E293B" stroke-width="2"/>

  <!-- Background Ambient Glow Spots -->
  <circle cx="120" cy="120" r="70" fill="#06B6D4" opacity="0.15" filter="url(#soft-glow)"/>
  <circle cx="160" cy="140" r="60" fill="#7C3AED" opacity="0.15" filter="url(#soft-glow)"/>

  <!-- Grid Pattern Overlay (Console Aesthetic) -->
  <g opacity="0.05" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="60" x2="800" y2="60"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="120" y1="0" x2="120" y2="240"/>
    <line x1="240" y1="0" x2="240" y2="240"/>
    <line x1="480" y1="0" x2="480" y2="240"/>
    <line x1="720" y1="0" x2="720" y2="240"/>
  </g>

  <!-- Left Quantum Hexagonal Emblem & Omega-Infinity Core -->
  <g transform="translate(120, 120)">
    <!-- Outer Rotating Orbital Ring -->
    <circle cx="0" cy="0" r="76" fill="none" stroke="url(#pulse-grad)" stroke-width="1.5" stroke-dasharray="10 6" opacity="0.7"/>
    <!-- Hexagonal Sovereign Shield -->
    <polygon points="0,-64 55,-32 55,32 0,64 -55,32 -55,-32" fill="#070B14" stroke="url(#cyan-glow)" stroke-width="3" filter="url(#neon-glow)"/>
    <polygon points="0,-50 43,-25 43,25 0,50 -43,25 -43,-25" fill="none" stroke="url(#violet-glow)" stroke-width="1.5" opacity="0.8"/>

    <!-- Infinity-Omega Core Symbol -->
    <text x="0" y="10" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="34" font-weight="900" fill="url(#cyan-glow)" filter="url(#neon-glow)">Ω∞</text>

    <!-- Corner Telemetry Nodes -->
    <circle cx="0" cy="-64" r="4" fill="#22D3EE"/>
    <circle cx="55" cy="-32" r="3.5" fill="#A855F7"/>
    <circle cx="55" cy="32" r="3.5" fill="#22D3EE"/>
    <circle cx="0" cy="64" r="4" fill="#10B981"/>
    <circle cx="-55" cy="32" r="3.5" fill="#22D3EE"/>
    <circle cx="-55" cy="-32" r="3.5" fill="#A855F7"/>
  </g>

  <!-- Right Brand Typography & Sovereign Status -->
  <g transform="translate(235, 0)">
    <!-- Top Pill Badge -->
    <rect x="0" y="42" width="275" height="24" rx="12" fill="#082F49" stroke="#06B6D4" stroke-width="1" opacity="0.85"/>
    <circle cx="14" cy="54" r="4" fill="#10B981"/>
    <text x="26" y="58" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#67E8F9" letter-spacing="1.5">FROZEN CORE v1.2 LTS • Δ0.00%</text>

    <!-- Main Brand Title -->
    <text x="0" y="118" font-family="Inter, Segoe UI, sans-serif" font-size="48" font-weight="900" fill="#FFFFFF" letter-spacing="3">ZYRQUEN</text>
    <text x="275" y="118" font-family="JetBrains Mono, monospace" font-size="44" font-weight="900" fill="url(#cyan-glow)" filter="url(#neon-glow)">Ω∞</text>

    <!-- Subtitle: Cloud & AI Command Center -->
    <text x="2" y="152" font-family="JetBrains Mono, monospace" font-size="17" font-weight="700" fill="url(#pulse-grad)" letter-spacing="3.5">CLOUD &amp; AI COMMAND CENTER</text>

    <!-- Technical Sovereign Tagline -->
    <text x="2" y="182" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600" fill="#94A3B8" letter-spacing="1.5">AUTONOMOUS CLOUD &amp; AI ORCHESTRATION • SOVEREIGN CONTROL PLANE</text>
  </g>
</svg>
