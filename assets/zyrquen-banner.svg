<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="ZYRQUEN Sovereign AI Engine banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>ZYRQUEN Ω Sovereign AI Engine</title>
<style>
  .spin{transform-box:fill-box;transform-origin:center;animation:sp 24s linear infinite}
  .spinr{transform-box:fill-box;transform-origin:center;animation:sp 16s linear infinite reverse}
  @keyframes sp{to{transform:rotate(360deg)}}
  .node{animation:np 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  .n2{animation-delay:.5s}.n3{animation-delay:1s}.n4{animation-delay:1.5s}
  @keyframes np{0%,100%{opacity:.45;transform:scale(.8)}50%{opacity:1;transform:scale(1.5)}}
  .run{fill:none;stroke-width:4;stroke-linecap:round;stroke-dasharray:9 91;animation:rn 4s linear infinite}
  .r1{stroke:#00e5ff}.r2{stroke:#ffd700;animation-delay:-1s}.r3{stroke:#a855f7;animation-delay:-2s}.r4{stroke:#fff;animation-delay:-3s}
  @keyframes rn{from{stroke-dashoffset:0}to{stroke-dashoffset:-100}}
  .f1{animation:fl 6s linear infinite}.f2{animation:fl2 9s linear infinite}
  @keyframes fl{from{transform:translateX(0)}to{transform:translateX(-1200px)}}
  @keyframes fl2{from{transform:translateX(-1200px)}to{transform:translateX(0)}}
  .sweep{animation:sw 6s ease-in-out infinite}
  @keyframes sw{0%{transform:translateX(-200px)}60%,100%{transform:translateX(1400px)}}
  .brk{animation:bk 3s ease-in-out infinite}
  @keyframes bk{0%,100%{opacity:.5}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#00e5ff"/><stop offset=".55" stop-color="#4f8cff"/><stop offset="1" stop-color="#a855f7"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffe680"/><stop offset="1" stop-color="#ffb300"/>
  </linearGradient>
  <radialGradient id="cbg" cx=".5" cy=".5" r=".6">
    <stop offset="0" stop-color="#10243f"/><stop offset="1" stop-color="#0a0f1a"/>
  </radialGradient>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#0a1628"/>
  </linearGradient>
  <linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0" spreadMethod="repeat">
    <stop offset="0" stop-color="#00e5ff"/><stop offset=".25" stop-color="#4f8cff"/><stop offset=".5" stop-color="#a855f7"/><stop offset=".75" stop-color="#ffd700"/><stop offset="1" stop-color="#00e5ff"/>
  </linearGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="blur" x="-5%" y="-300%" width="110%" height="700%"><feGaussianBlur stdDeviation="3"/></filter>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#00e5ff" opacity=".05"/></pattern>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#00e5ff" stroke-opacity=".05"/></pattern>
</defs>
<linearGradient id="sweepg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00e5ff" stop-opacity="0"/><stop offset=".5" stop-color="#00e5ff" stop-opacity=".12"/><stop offset="1" stop-color="#00e5ff" stop-opacity="0"/></linearGradient>
<clipPath id="card"><rect width="1200" height="320" rx="24"/></clipPath>
<rect width="1200" height="320" rx="24" fill="url(#bg)"/>
<rect width="1200" height="320" rx="24" fill="url(#grid)"/>
<rect width="1200" height="320" rx="24" fill="url(#scan)"/>
<g clip-path="url(#card)"><rect class="sweep" x="0" y="0" width="200" height="320" fill="url(#sweepg)"/></g>
<rect x="2" y="2" width="1196" height="316" rx="23" fill="none" stroke="#00e5ff" stroke-opacity=".25" stroke-width="1.5"/>
<g filter="url(#glow)">
  <rect class="run r1" pathLength="100" x="2" y="2" width="1196" height="316" rx="23"/>
  <rect class="run r2" pathLength="100" x="2" y="2" width="1196" height="316" rx="23"/>
  <rect class="run r3" pathLength="100" x="2" y="2" width="1196" height="316" rx="23"/>
  <rect class="run r4" pathLength="100" x="2" y="2" width="1196" height="316" rx="23"/>
</g>
<g class="brk" fill="none" stroke="#ffd700" stroke-width="2.5" stroke-linecap="square">
  <path d="M22 54 V22 H54"/><path d="M1178 54 V22 H1146"/><path d="M22 266 V298 H54"/><path d="M1178 266 V298 H1146"/>
</g>
<g transform="translate(96.39999999999999,56.39999999999999) scale(0.78)">
    <circle cx="120" cy="120" r="108" fill="url(#cbg)" stroke="url(#g)" stroke-width="3" filter="url(#glow)"/>
    <circle class="spin" cx="120" cy="120" r="98" fill="none" stroke="#00e5ff" stroke-opacity=".7" stroke-width="2" stroke-dasharray="6 10"/>
    <circle class="spinr" cx="120" cy="120" r="86" fill="none" stroke="#ffd700" stroke-opacity=".8" stroke-width="1.5" stroke-dasharray="2 8"/>
    <polygon points="120,40 189,80 189,160 120,200 51,160 51,80" fill="none" stroke="url(#g)" stroke-opacity=".5" stroke-width="1.5"/>
    <path d="M92 150 H108 C90 138 82 122 82 106 A38 38 0 1 1 158 106 C158 122 150 138 132 150 H148" fill="none" stroke="url(#g)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <path d="M92 150 H108 C90 138 82 122 82 106 A38 38 0 1 1 158 106 C158 122 150 138 132 150 H148" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle class="node" cx="120" cy="12" r="5" fill="#00e5ff" filter="url(#glow)"/>
    <circle class="node n2" cx="228" cy="120" r="4" fill="#ffd700" filter="url(#glow)"/>
    <circle class="node n3" cx="120" cy="228" r="5" fill="#a855f7" filter="url(#glow)"/>
    <circle class="node n4" cx="12" cy="120" r="4" fill="#00e5ff" filter="url(#glow)"/>
  </g>
<g font-family="'Courier New', Consolas, 'SF Mono', monospace" font-weight="700">
  <text x="330" y="150" font-size="84" letter-spacing="8" fill="url(#g)" filter="url(#glow)">ZYRQUEN</text>
  <text x="1010" y="150" font-size="84" fill="url(#gold)" filter="url(#glow)" font-family="Georgia, 'Times New Roman', serif">Ω</text>
  <text x="334" y="198" font-size="30" letter-spacing="14" fill="url(#gold)">SOVEREIGN AI ENGINE</text>
  <text x="334" y="236" font-size="16" letter-spacing="3" font-weight="400" fill="#8fb4d9">AUDIT-FIRST  ·  LOCALLY VERIFIED  ·  PWA  ·  LTS</text>
</g>
<g clip-path="url(#card)">
  <rect class="f1" x="0" y="302" width="2400" height="14" fill="url(#flow)" opacity=".5" filter="url(#blur)"/>
  <rect class="f1" x="0" y="308" width="2400" height="12" fill="url(#flow)"/>
  <rect class="f2" x="0" y="304" width="2400" height="2" fill="url(#flow)" opacity=".8"/>
</g>
</svg>
