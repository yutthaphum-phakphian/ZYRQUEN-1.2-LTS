<style>text{font-family:'Noto Sans Thai','Sarabun','Tahoma','Segoe UI',Arial,sans-serif}.w{font-size:11px;fill:#fff}.wb{font-size:12px;font-weight:bold;fill:#fff}.k{font-size:11px;fill:#1a1a1a}.y{font-size:11px;fill:#ffe066}.g{font-size:11px;fill:#7ff0c0}
