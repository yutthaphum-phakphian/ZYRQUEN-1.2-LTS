@keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
@keyframes scan{0%{transform:translateX(0);opacity:0}20%,80%{opacity:.7}100%{transform:translateX(354px);opacity:0}}
.c1{animation:drift1 9s ease-in-out infinite}.c2{animation:drift2 11s ease-in-out infinite}
.head{transform-origin:190px 300px;animation:bob 3s ease-in-out infinite}
