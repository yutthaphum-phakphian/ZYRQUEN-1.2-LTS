<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 12" width="820" height="12" role="img" aria-label="divider" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<style>
  .f{animation:f 4s linear infinite}.g{animation:g 6s linear infinite}
  @keyframes f{from{transform:translateX(0)}to{transform:translateX(-820px)}}
  @keyframes g{from{transform:translateX(-820px)}to{transform:translateX(0)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<linearGradient id="r" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="820" y2="0" spreadMethod="repeat">
  <stop offset="0" stop-color="#00e5ff"/><stop offset=".25" stop-color="#4f8cff"/><stop offset=".5" stop-color="#a855f7"/><stop offset=".75" stop-color="#ffd700"/><stop offset="1" stop-color="#00e5ff"/>
</linearGradient>
<filter id="b" x="-5%" y="-300%" width="110%" height="700%"><feGaussianBlur stdDeviation="2.5"/></filter>
<clipPath id="c"><rect width="820" height="12" rx="6"/></clipPath>
</defs>
<g clip-path="url(#c)">
  <rect class="f" x="0" y="1" width="1640" height="10" fill="url(#r)" opacity=".5" filter="url(#b)"/>
  <rect class="f" x="0" y="4" width="1640" height="4" fill="url(#r)"/>
  <rect class="g" x="0" y="5.5" width="1640" height="1" fill="#fff" opacity=".5"/>
</g>
</svg>
