                  <h2 className="text-base font-bold text-white">MARKETING CLAIMS VS MATHEMATICAL PROOFS AUDIT</h2>
                  <p className="text-xs text-slate-400 mt-1">Strict distinction between narrative claims and cryptographically verifiable schema proofs.</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                  <div className="bg-red-950/20 border border-red-800/60 p-5 rounded-2xl space-y-3">
                    <div className="font-bold text-red-400 text-sm border-b border-red-800/40 pb-2">
                      ⚠️ UNVERIFIED EXTERNAL ATTESTATION
                    </div>
                    <p className="text-slate-300">
                      Narrative claims without underlying binary signature bytes, public key arrays, or certificate chains are flagged as:
                    </p>
                    <div className="p-2 bg-slate-950 rounded border border-red-900 font-mono text-[10px] text-red-300">
                      STATUS: UNVERIFIED_EXTERNAL_ATTESTATION
                    </div>
                    <p className="text-slate-400">
                      Reason: Manifest fields and hex digest lengths can be spoofed locally unless backed by algorithm-specific verification logic.
                    </p>
                  </div>

                  <div className="bg-emerald-950/20 border border-emerald-800/60 p-5 rounded-2xl space-y-3">
                    <div className="font-bold text-emerald-400 text-sm border-b border-emerald-800/40 pb-2">
                      🟢 MATHEMATICAL CRYPTO PROOF
                    </div>
                    <p className="text-slate-300">
                      A proof is mathematically valid only when complying with ZyrquenCryptoProofPayloadSchema v1.2.1:
                    </p>
                    <ul className="list-disc pl-4 space-y-1 text-slate-400 text-[11px]">
                      <li>RFC 3161 TSA Proof + Nonce Replay Protection</li>
                      <li>10/10 Custodian Public Keys + Key Fingerprints</li>
                      <li>10 Signature Bytes Blocks (ML-DSA-87 / SPHINCS+)</li>
                      <li>10 HSM Attestation Blobs with FIPS certification</li>
                    </ul>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 9: 12-STAGE TRACE REPLAY */}
            {activeTab === 'replay' && (
              <div className="space-y-4">
                <div className="bg-slate-900/60 p-5 rounded-2xl border border-slate-800 flex flex-wrap items-center justify-between gap-4">
                  <div>
                    <h2 className="text-base font-bold text-white">12-STAGE FORENSIC TRACE REPLAY ENGINE</h2>
                    <p className="text-xs text-slate-400">Sequential verification trace through PQC, HSM Quorum, and Legal Compliance Gates.</p>
                  </div>
                  <div className="flex gap-2">
                    <button
                      onClick={handleStartReplay}
                      disabled={isReplaying}
                      className="px-4 py-2 bg-purple-600 hover:bg-purple-500 disabled:bg-slate-800 text-white text-xs font-bold rounded-lg transition-all"
                    >
                      {isReplaying ? "Replaying Trace..." : "▶ Start Trace Replay"}
                    </button>
                    <button
                      onClick={() => { setReplayStage(0); setIsReplaying(false); }}
                      className="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold rounded-lg"
                    >
                      Reset
                    </button>
                  </div>
                </div>

                <div className="space-y-2">
                  {REPLAY_STAGES.map((stg, idx) => {
                    const isPassed = idx < replayStage || (!isReplaying && replayStage === REPLAY_STAGES.length - 1);
                    const isCurrent = idx === replayStage && isReplaying;

                    return (
                      <div
                        key={stg.id}
                        className={`p-3 rounded-xl border flex items-center justify-between text-xs transition-all ${
                          isPassed ? 'bg-emerald-950/20 border-emerald-800/60 text-emerald-300' :
                          isCurrent ? 'bg-purple-950/40 border-purple-500 text-purple-200 animate-pulse' :
                          'bg-slate-950/60 border-slate-800 text-slate-500'
                        }`}
                      >
                        <div className="flex items-center gap-3">
                          <span className="font-bold text-amber-400">{stg.id}</span>
                          <span className="font-mono font-bold">{stg.code}</span>
                          <span className="hidden md:inline text-slate-300">— {stg.name}</span>
                        </div>
                        <div className="flex items-center gap-3">
                          <span className="text-[10px] text-slate-400 font-mono">{stg.latency}</span>
                          <span className="font-bold text-[10px]">
                            {isPassed ? 'PASSED 🟢' : isCurrent ? 'EXECUTING... ⚡' : 'PENDING ⏳'}
                          </span>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* Forensic Terminal Console */}
            <div className="bg-[#050811] p-4 rounded-2xl border border-slate-800 space-y-2 text-xs">
              <div className="flex items-center justify-between text-slate-400 border-b border-slate-800 pb-2">
                <span className="font-bold text-amber-400">FORENSIC TERMINAL LOGS</span>
                <span>SSoT Delta: 0.00%</span>
              </div>
              <div className="h-32 overflow-y-auto font-mono text-[11px] space-y-1 text-slate-300">
                {consoleLogs.map((log, i) => (
                  <div key={i}>{log}</div>
                ))}
              </div>
            </div>

          </main>

          {/* Footer */}
          <footer className="border-t border-slate-800 bg-[#070b18] py-4 text-center text-xs text-slate-500">
            ZYRQUEN Ω∞ Sovereign Kernel • Post-Quantum Hardware Seal Ledger & Verification Suite
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
