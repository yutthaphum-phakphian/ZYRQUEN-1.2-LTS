<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="ZYRQUEN Ω™ Sovereign World Engine" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset="1" stop-color="#0d1020"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="0.6" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#ffd700"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#00e5ff" opacity="0.05"/>
    </pattern>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00e5ff" stroke-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect width="1200" height="300" fill="url(#scan)"/>

  <!-- corner brackets -->
  <g fill="none" stroke="#00e5ff" stroke-width="3" stroke-linecap="square">
    <path d="M24 64V24H64"/>
    <path d="M1136 24H1176V64"/>
    <path d="M24 236V276H64"/>
    <path d="M1136 276H1176V236"/>
  </g>

  <!-- shield mark -->
  <g transform="translate(150 150)">
    <path d="M0 -62L52 -42V8C52 38 28 56 0 68C-28 56 -52 38 -52 8V-42Z" fill="none" stroke="#00e5ff" stroke-width="4"/>
    <path d="M0 -40L34 -27V6C34 25 18 37 0 45C-18 37 -34 25 -34 6V-27Z" fill="#00e5ff" fill-opacity="0.12" stroke="#a855f7" stroke-width="2"/>
    <path d="M6 -26L-12 4H0L-6 28L14 -4H2Z" fill="#ffd700"/>
  </g>

  <!-- text -->
  <text x="270" y="150" font-family="'Courier New', Consolas, monospace" font-size="84" font-weight="700" fill="url(#title)" letter-spacing="6">ZYRQUEN Ω™</text>
  <text x="274" y="196" font-family="'Courier New', Consolas, monospace" font-size="26" fill="#9fb4c7" letter-spacing="14">SOVEREIGN WORLD ENGINE</text>
  <text x="274" y="238" font-family="'Courier New', Consolas, monospace" font-size="18" fill="#00e5ff" fill-opacity="0.8" letter-spacing="3">TypeScript  ◆  React 19  ◆  Vite 6  ◆  Vitest  ◆  GitHub Actions</text>

  <!-- version tag -->
  <g transform="translate(1000 50)">
    <rect width="150" height="34" rx="3" fill="none" stroke="#ffd700" stroke-width="2"/>
    <text x="75" y="23" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="17" fill="#ffd700" letter-spacing="2">v1.2.1 LTS</text>
  </g>
</svg>
