    <script>
      // Suppress benign Vite websocket notices in sandboxed iframe environment
      (function() {
        const isBenignVite = function(arg) {
          if (!arg) return false;
          try {
            const str = (arg instanceof Error ? (arg.message + ' ' + arg.stack) : String(arg)).toLowerCase();
            return str.includes('[vite]') || str.includes('websocket') || str.includes('failed to connect');
          } catch (e) {
            return false;
          }
        };
        const originalWarn = console.warn;
        const originalError = console.error;
        const originalLog = console.log;
        const originalInfo = console.info;
        console.warn = function(...args) {
          if (args.some(isBenignVite)) return;
          originalWarn.apply(console, args);
        };
        console.error = function(...args) {
          if (args.some(isBenignVite)) return;
          originalError.apply(console, args);
        };
        console.log = function(...args) {
          if (args.some(isBenignVite)) return;
          originalLog.apply(console, args);
        };
        console.info = function(...args) {
          if (args.some(isBenignVite)) return;
          originalInfo.apply(console, args);
        };
        window.addEventListener('unhandledrejection', function(event) {
          if (isBenignVite(event.reason)) {
            event.preventDefault();
          }
        });
      })();
    </script>
