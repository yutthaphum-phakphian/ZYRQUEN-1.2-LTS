<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZYRQUEN Ω∞ Sovereign World Engine</title>
    <meta name="description" content="Sovereign Operating System & Civilization Intelligence Control Plane - Block #849202 (Frozen v1.2 LTS)" />
    <script>
      // Filter benign Vite websocket disconnection warnings in sandboxed preview iframe
      (function() {
        if (typeof window === 'undefined') return;
        var isViteMsg = function(arg) {
          if (!arg) return false;
          var str = '';
          try {
            str = typeof arg === 'string' ? arg : (arg.message || arg.stack || String(arg));
          } catch(e) {
            str = String(arg);
          }
          return str.indexOf('[vite]') !== -1 ||
                 str.indexOf('failed to connect to websocket') !== -1 ||
                 str.indexOf('WebSocket closed without opened') !== -1 ||
                 (str.indexOf('WebSocket') !== -1 && str.indexOf('vite') !== -1);
        };

        var shouldSuppress = function(args) {
          for (var i = 0; i < args.length; i++) {
            if (isViteMsg(args[i])) return true;
          }
          return false;
        };

        var origConsoleError = console.error;
        var origConsoleWarn = console.warn;
        var origConsoleLog = console.log;
        var origConsoleInfo = console.info;
        var origConsoleDebug = console.debug;

        console.error = function() {
          if (shouldSuppress(arguments)) return;
          return origConsoleError.apply(console, arguments);
        };
        console.warn = function() {
          if (shouldSuppress(arguments)) return;
          return origConsoleWarn.apply(console, arguments);
        };
        console.info = function() {
          if (shouldSuppress(arguments)) return;
          return origConsoleInfo.apply(console, arguments);
        };
        console.debug = function() {
          if (shouldSuppress(arguments)) return;
          return origConsoleDebug.apply(console, arguments);
        };
        console.log = function() {
          if (shouldSuppress(arguments)) return;
          return origConsoleLog.apply(console, arguments);
        };

        window.addEventListener('error', function(e) {
          if (isViteMsg(e.message) || isViteMsg(e.error)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (isViteMsg(e.reason)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
