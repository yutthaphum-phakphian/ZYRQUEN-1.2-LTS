    <script>
      // Filter benign Vite websocket disconnection warnings in sandboxed preview iframe
      (function() {
        if (typeof window === 'undefined') return;
        var origConsoleError = console.error;
        var origConsoleWarn = console.warn;
        console.error = function() {
          var first = arguments[0];
          if (typeof first === 'string' && (first.indexOf('[vite]') !== -1 || first.indexOf('failed to connect to websocket') !== -1)) {
            return;
          }
          return origConsoleError.apply(console, arguments);
        };
        console.warn = function() {
          var first = arguments[0];
          if (typeof first === 'string' && (first.indexOf('[vite]') !== -1 || first.indexOf('failed to connect to websocket') !== -1)) {
            return;
          }
          return origConsoleWarn.apply(console, arguments);
        };
      })();
    </script>
