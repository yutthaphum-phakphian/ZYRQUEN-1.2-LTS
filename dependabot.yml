version: 2
updates:
  # Maintain dependencies for GitHub Actions Workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Bangkok"
    open-pull-requests-limit: 10
    reviewers:
      - "yuttaphum-phakphian"
    labels:
      - "security"
      - "ci/cd"
      - "sovereign-audit"

  # Maintain dependencies for Node.js / React Frontend & Gateway
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Bangkok"
    open-pull-requests-limit: 10
    reviewers:
      - "yuttaphum-phakphian"
    labels:
      - "dependencies"
      - "npm"

  # Maintain dependencies for Python Test & Audit Tools
  - package-ecosystem: "pip"
    directory: "/server"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Bangkok"
    open-pull-requests-limit: 5
    reviewers:
      - "yuttaphum-phakphian"
    labels:
      - "python"
      - "security"
