# =============================================================================
# ZYRQUEN Ω∞ Senate Gate — Enterprise Benchmark Values v5.0 LTS (FIXED)
# High-Throughput, Sub-Millisecond Zero-Trust Quorum Governance Engine
# =============================================================================

global:
  environment: benchmark
  clusterId: zyrquen-omega-core-us-east-1
  geoRegion: us-east-1
  tier: sovereign-enterprise
  sovereignDomain: senate.zyrquen.network

replicaCount: 12

image:
  repository: zyrquen/senate-gate-engine
  pullPolicy: IfNotPresent
  tag: "v5.0.0-LTS"

imagePullSecrets:
  - name: zyrquen-registry-key

nameOverride: "senate-gate"
fullnameOverride: "senate-gate-enterprise"

serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::777000111222:role/zyrquen-senate-gate-hsm-signer
  name: "senate-gate-sa"

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8181"
  prometheus.io/path: "/metrics"
  sidecar.istio.io/inject: "false"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# FIX 1: Mount emptyDir to /tmp to support readOnlyRootFilesystem
volumeMounts:
  - name: tmp-volume
    mountPath: /tmp

volumes:
  - name: tmp-volume
    emptyDir: {}

resources:
  requests:
    cpu: 2000m
    memory: 4Gi
  limits:
    cpu: 4000m
    memory: 8Gi

# Zero-Trust Policy Engine Settings
# FIX 2: Sync quorum parameters with SSoT rules (8/10 votes = 0.80 ratio)
engine:
  mode: "v2.5-OPTIMIZED"
  shortCircuitEnabled: true
  failSafeClosed: true
  maxP99LatencyTargetMs: 1.0
  pqcAlgorithm: "ML-DSA-87"
  hsmFipsLevelRequired: 4
  minSenateVotesRequired: 8
  quorumSupermajorityRatio: 0.80
  maxTokenBudget: 100000

# High-Availability Horizontal Pod Autoscaler
autoscaling:
  enabled: true
  minReplicas: 6
  maxReplicas: 36
  targetCPUUtilizationPercentage: 65
  targetMemoryUtilizationPercentage: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 8
          periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60

# Pod Disruption Budget for Non-Stop Consensus
podDisruptionBudget:
  minAvailable: "80%"

# Anti-Affinity & Multi-AZ Distribution
# FIX 3: Change podAntiAffinity to preferred to prevent Pending pods on small clusters
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - senate-gate
          topologyKey: "kubernetes.io/hostname"
      - weight: 50
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - senate-gate
          topologyKey: "topology.kubernetes.io/zone"

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: "topology.kubernetes.io/zone"
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: senate-gate

# FIX 4: Change service type to LoadBalancer to match AWS NLB annotations
service:
  type: LoadBalancer
  port: 8181
  targetPort: 8181
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internal"

# Ultra-Low Latency Probes
livenessProbe:
  httpGet:
    path: /health/liveness
    port: 8181
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 1
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health/readiness
    port: 8181
  initialDelaySeconds: 3
  periodSeconds: 3
  timeoutSeconds: 1
  failureThreshold: 2

# Distributed Cache & Storage Connectors
dragonflyCache:
  enabled: true
  host: "dragonfly-cluster.senate.internal"
  port: 6379
  maxConnectionPool: 256
  timeoutMs: 15

cockroachDb:
  host: "cockroachdb-public.senate.internal"
  port: 26257
  database: "zyrquen_senate_global"
  sslMode: "verify-full"
  maxOpenConns: 128
  maxIdleConns: 64

# OpenTelemetry & Tracing
telemetry:
  enabled: true
  samplingRate: 0.05
  otlpEndpoint: "http://tempo-distributor.monitoring.svc:4317"
  logLevel: "INFO"
  structuredJson: true
