# ZYRQUEN Ω∞ — Sovereign Control Plane Helm Values Spec v1.2.1 LTS
replicaCount: 3

image:
  repository: registry.zyrquen.io/sovereign/control-plane
  pullPolicy: IfNotPresent
  tag: "1.2.1-lts"

securityContext:
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

env:
  SSOT_GENESIS_ANCHOR: "#849202"
  SSOT_BASELINE_DRIFT_TARGET: "0.000%"
  PQC_PRIMARY_ALGORITHM: "ML-DSA-87"
  HSM_QUORUM_REQUIRED: "10/10"
  INTERCEPTOR_RISK_THRESHOLD: "0.85"
  TELEMETRY_PORT: "8443"

service:
  type: ClusterIP
  ports:
    - name: https
      port: 8443
      targetPort: 8443
      protocol: TCP

resources:
  limits:
    cpu: "2000m"
    memory: "4Gi"
  requests:
    cpu: "500m"
    memory: "1Gi"

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

nodeSelector:
  zyrquen.io/hsm-attached: "true"
  zyrquen.io/pqc-accelerator: "enabled"
