name: ZYRQUEN Ω∞ Sovereign Control Plane CI/CD

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sovereign-ci-gate:
    name: 🛡️ ZYRQUEN Ω∞ Sovereign Control Plane CI/CD (FROZEN v1.2.1 LTS)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: 🔍 Static TypeScript Lint Check
        run: npm run lint

      - name: 🧪 Run Sovereign Integration Test Suite (Thai Statutory & API Verification)
        run: npx vitest run src/tests/integration-sovereign-control-plane.test.ts

      - name: 🧪 Run Full Vitest & Unit Test Suites
        run: npm test

      - name: 🏗️ Build Production Bundles
        run: npm run build
