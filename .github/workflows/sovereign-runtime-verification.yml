name: Sovereign Runtime Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sovereign-runtime-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Run TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run Sovereign Runtime Verification
        run: npx vitest run tests/sovereign-runtime-verification.test.tsx --coverage
