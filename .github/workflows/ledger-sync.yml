name: ZYRQUEN Sovereign Ledger Sync & Verification

on:
  release:
    types: [published]
  push:
    branches: [ "master", "main", "v1.2-LTS" ]

jobs:
  verify-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sovereign Repository
        uses: actions/checkout@v4

      - name: Setup Node.js & PQC Cryptographic Engine
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Verify SSoT Genesis & Merkle Roots
        run: |
          echo "Verifying Block #849202 & Merkle Root 909ab814...43fa4c68"
          npm ci
          npx tsc --noEmit
          npm test -- --run

      - name: Generate Immutable Audit Ledger Report
        run: |
          node scripts/generate_court_evidence_qr.js --verify-all-seals
          echo "Ledger-to-GitHub Sync Complete: 100% PURIFIED"
