name: 🚀 ZYRQUEN Ω∞ Ledger-to-GitHub Sync & PQC Crypto-Agility Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pqc_override_scheme:
        description: "Crypto-Agility Override Scheme"
        type: choice
        required: false
        default: AUTO_DETECT
        options:
          - AUTO_DETECT
          - DILITHIUM5
          - SPHINCS_FALLBACK

permissions:
  contents: write
  id-token: write

concurrency:
  group: ledger-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-sync-ledger:
    name: 🛡️ Audit Ledger, PQC Parity & SPHINCS+ Fallback Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🔬 Verify ledger invariants
        shell: bash
        run: node ./scripts/verify-ledger.mjs

      - name: 🛡️ Verify PQC scheme selection
        shell: bash
        env:
          PQC_OVERRIDE: ${{ github.event.inputs.pqc_override_scheme || 'AUTO_DETECT' }}
        run: node ./scripts/verify-pqc.mjs

      - name: 🧹 Lint
        run: npm run lint

      - name: 🎭 Run tests
        run: npm test -- --ci

      - name: 🚀 Build release bundle
        run: npm run build

      - name: 📤 Commit sync status if changed
        shell: bash
        run: |
          git config user.name "EP-SOVEREIGN-01"
          git config user.email "sovereign@zyrquen.internal"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: sync ledger and PQC status"
          git push origin HEAD:${GITHUB_REF_NAME}
