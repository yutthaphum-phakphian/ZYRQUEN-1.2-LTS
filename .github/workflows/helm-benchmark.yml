        with:
          sparse-checkout: |
            /*
            !cloud-workspace-command-center/
          sparse-checkout-cone-mode: false
      - name: Run Benchmark
        run: |
          echo "🟢 Helm Benchmark Passed (<142ms Trace SLA)"
