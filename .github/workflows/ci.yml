name: 🛡️ ZYRQUEN Ω∞ CI — Core Invariants, Tests & Build Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-test:
    name: Lint, Test & Sovereign Build Gate v1.2 LTS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Compile Python Scripts & Tests
        run: find scripts tests -type f -name '*.py' -print0 | xargs -0 -r python -m py_compile

      - name: TypeScript & Static Lint Verification
        run: npm run lint

      - name: Execute Sovereign Unit Tests & Invariants Suite
        run: npm test

      - name: Build Sovereign Client & Server Bundles
        run: npm run build
