name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Type Check and Lint
        run: npm run lint

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v4
        continue-on-error: true

      - name: Build Vite Client Application for GitHub Pages
        # Build client assets into dist directory using base path derived from configure-pages or repo name
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path || '/ZYRQUEN-1.2-LTS/' }}
          BASE_PATH: ${{ steps.pages.outputs.base_path || '/ZYRQUEN-1.2-LTS/' }}
        run: npx vite build

      - name: Ensure 404.html fallback exists for SPA routing
        run: |
          if [ ! -f ./dist/404.html ]; then
            cp ./dist/index.html ./dist/404.html
          fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
