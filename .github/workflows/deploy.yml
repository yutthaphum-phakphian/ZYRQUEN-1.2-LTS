name: Deploy Zyrquen PWA to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install

      - name: Build React PWA Application
        run: npm run build
        env:
          CI: false
          GITHUB_PAGES: 'true'

      - name: Prepare Deployment Artifact
        run: |
          if [ -d "dist" ]; then
            echo "Vite build detected in dist/"
            # Ensure 404 fallback for SPA routing on GitHub Pages
            cp dist/index.html dist/404.html 2>/dev/null || true
          elif [ -d "build" ]; then
            echo "CRA build detected in build/"
            cp -r build dist
          fi

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
