name: Deploy Zyrquen PWA to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !cloud-workspace-command-center/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build React PWA Application
        run: npm run build
        env:
          CI: false
          GITHUB_PAGES: 'true'
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Prepare Deployment Artifact
        run: |
          if [ -d "dist" ]; then
            echo "Vite build detected in dist/"
            # Ensure 404 fallback for SPA routing on GitHub Pages
            cp dist/index.html dist/404.html 2>/dev/null || true
            touch dist/.nojekyll
          elif [ -d "build" ]; then
            echo "CRA build detected in build/"
            cp -r build dist
            touch dist/.nojekyll
          fi

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
