name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Type Check and Lint
        run: npm run lint

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Build Vite Client Application for GitHub Pages
        # GitHub Pages hosts only the static client. The API/WebSocket server is
        # built from server.ts by the CI workflow and must run on a separate host.
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: npx vite build

      - name: Create 404.html fallback for SPA routing
        run: cp ./dist/index.html ./dist/404.html

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
