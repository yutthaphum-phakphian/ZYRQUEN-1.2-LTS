name: GitHub Pages Deployment

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !cloud-workspace-command-center/
          sparse-checkout-cone-mode: false

      # 1. Setup Node.js v22 with cache
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 2. Install Packages with legacy peer deps for React 19 compatibility
      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      # 3. Build Project with Vite (Relative Base Path for GitHub Pages)
      - name: Build Project
        run: npm run build
        env:
          CI: false
          GITHUB_PAGES: 'true'
          NODE_OPTIONS: '--max-old-space-size=4096'

      # 4. Create 404 fallback & copy README.md for GitHub Pages
      - name: Prepare SPA 404 Fallback, README & .nojekyll
        run: |
          if [ -d "dist" ]; then
            cp dist/index.html dist/404.html 2>/dev/null || true
            cp README.md dist/README.md 2>/dev/null || true
            cp banner.svg dist/banner.svg 2>/dev/null || true
            cp replay_verification_dashboard.svg dist/replay_verification_dashboard.svg 2>/dev/null || true
            touch dist/.nojekyll
          fi

      # 5. Setup Pages (auto-enable GitHub Pages if not yet configured)
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true

      # 6. Upload Artifact
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      # 7. Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

