name: 🚀 ZYRQUEN Ω∞ GitHub Pages Deployment Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Grant GITHUB_TOKEN the permissions required to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build and SSoT Verification Job
  build-and-verify:
    name: 🛡️ SSoT Verification & Build Production Bundle
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout Sovereign Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js Environment (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📥 Clean Install Dependencies (npm ci)
        run: npm ci

      - name: 🔬 Verify SSoT Invariants & Genesis SHA-256 Table
        run: |
          node -e '
            const fs = require("fs");
            const tablePath = "./SHA256_VERIFIED_TABLE.json";
            if (!fs.existsSync(tablePath)) {
              console.error("❌ CRITICAL: SHA256_VERIFIED_TABLE.json missing!");
              process.exit(1);
            }
            const ledger = JSON.parse(fs.readFileSync(tablePath, "utf8"));
            
            console.log("===========================================================================");
            console.log("  ZYRQUEN Ω∞ GITHUB PAGES PRE-DEPLOYMENT SSoT AUDIT");
            console.log("  Block Height Anchor :", ledger.canonical.blockHeight);
            console.log("  Genesis Merkle Root :", ledger.canonical.merkleRoot);
            console.log("  Canonical Seals     :", ledger.canonical.canonicalSeals);
            console.log("  Zero Drift Invariant:", ledger.canonical.drift);
            console.log("===========================================================================");
            
            if (ledger.canonical.blockHeight !== 849202 || ledger.canonical.canonicalSeals !== 14902) {
              console.error("❌ CRITICAL: SSoT Drift Detected!");
              process.exit(1);
            }
            if (ledger.canonical.merkleRoot !== "909ab814479844d8a14816bed34cdbb07528e18501da86fc4691763a43fa4c68") {
              console.error("❌ CRITICAL: Merkle Root Hash Mismatch!");
              process.exit(1);
            }
            console.log("✅ SSoT Δ0 (ZERO DRIFT 0.00%) VERIFIED — READY FOR PRODUCTION DEPLOYMENT 🟢");
          '

      - name: 🧹 Static Analysis & Type Safety Check
        run: npm run lint

      - name: 🎭 Execute Unit & Forensic Test Suite
        run: npm test

      - name: 🚀 Build Production Single-Page Application (Vite)
        run: npm run build

      - name: 🌐 Configure GitHub Pages Environment
        uses: actions/configure-pages@v5

      - name: 📤 Upload Build Artifacts to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  # Deployment Job
  deploy-pages:
    name: 🚀 Deploy Production Bundle to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-verify
    steps:
      - name: 🌐 Deploy Production Single-Page App
        id: deployment
        uses: actions/deploy-pages@v4
