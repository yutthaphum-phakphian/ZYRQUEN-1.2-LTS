name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ติดตั้ง Dependencies โดยข้ามปัญหา Version Mismatch
      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      # ตรวจสอบ Lint โดยไม่สั่งยกเลิกการ Build หากพบ Warning
      - name: Type Check and Lint (Non-blocking)
        run: npm run lint || true

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v4

      # บิวด์แอปพลิเคชัน Vite พร้อมตั้งค่า Base Path ให้ถูกต้อง
      - name: Build Vite Client Application for GitHub Pages
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: npx vite build --base=${{ steps.pages.outputs.base_path }}/

      # สร้าง 404.html สำหรับทำ SPA Client-Side Routing
      - name: Create 404.html fallback for SPA routing
        run: cp ./dist/index.html ./dist/404.html

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
