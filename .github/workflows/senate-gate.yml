name: Senate Gate - Helm Chart & Enterprise Performance Pipeline

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  senate-gate:
    name: 🛡️ Senate Gate - Helm Chart & Enterprise Performance
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install Node & Dev Dependencies
        run: |
          if [ -f "package.json" ]; then
            npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          else
            echo "⚠️ package.json not found in root directory. Skipping npm install."
          fi

      - name: 🧪 Run Senate Gate Verification
        run: |
          python3 scripts/zyrquen-security-gate.py
