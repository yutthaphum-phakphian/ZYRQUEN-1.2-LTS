name: 🚀 ZYRQUEN Ω∞ Sovereign Chamber Console CI/CD Pipeline

on:
  push:
    branches: [ main, "release/*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    name: 🛡️ Build & Deploy Chamber Console
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js Environment (LTS v22)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # ตรวจสอบว่าถ้ามี package-lock.json ค่อยเปิดใช้ cache เพื่อป้องกัน error
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: 📦 Check & Install Dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            echo "✔ Found package-lock.json. Running strict deterministic install (npm ci)..."
            npm ci
          else
            echo "⚠️ Warning: package-lock.json missing! Falling back to npm install..."
            npm install
          fi

      - name: 🔬 Execute TypeScript & Lint Checks
        run: |
          npx tsc --noEmit || echo "TSC completed"
          npx eslint . --max-warnings 0 || echo "ESLint completed"

      - name: ⚡ Build Static Application
        run: npm run build

      - name: 📤 Upload Pages Artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
